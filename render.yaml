services:
  - type: web
    name: core-asset-platform
    env: docker
    plan: free
    region: singapore
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "true"
      - key: APP_KEY
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: APP_URL
        value: https://core-asset-platform.onrender.com # Update this after first deploy
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: FORCE_HTTPS
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: core-asset-db
          property: connectionString
      - key: PORT
        value: "80"

databases:
  - name: core-asset-db
    plan: free
    region: singapore
