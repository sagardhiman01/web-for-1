services:
  - type: web
    name: web-for-1
    env: docker
    plan: free
    region: singapore
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "true"
      - key: APP_KEY
        value: base64:Q3Xosa/g7bpQ48A/a38tqmNB5nZqVjiRE0MDTplfcX0=
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_PORT
        value: "5432"
      - key: APP_URL
        value: https://web-for-1.onrender.com
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: FORCE_HTTPS
        value: "true"
      - key: PURCHASECODE
        value: activated
      - key: CACHE_DRIVER
        value: array
      - key: SESSION_DRIVER
        value: array
      - key: LOG_CHANNEL
        value: stderr
      - key: DATABASE_URL
        fromDatabase:
          name: core-asset-db
          property: connectionString
      - key: PORT
        value: "80"

databases:
  - name: core-asset-db
    plan: free
    region: singapore
