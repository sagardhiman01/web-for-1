# Nginx high-load site config for Core Asset Investing
# Update paths, server_name and upstream addresses for your infra.

upstream php_app_pool {
    least_conn;
    server 127.0.0.1:9000 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

limit_req_zone $binary_remote_addr zone=api_rate:20m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:20m;

server {
    listen 80;
    server_name coreassetinvesting.com www.coreassetinvesting.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name coreassetinvesting.com www.coreassetinvesting.com;

    # SSL placeholders (replace with real cert paths)
    ssl_certificate     /etc/ssl/certs/core-asset/fullchain.pem;
    ssl_certificate_key /etc/ssl/private/core-asset/privkey.pem;

    root /var/www/core-asset-investing;
    index index.php;
    charset utf-8;

    client_max_body_size 20m;
    keepalive_timeout 65;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss application/xml image/svg+xml;

    # Connection protection
    limit_conn conn_limit_per_ip 40;

    location = /healthz {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"ok"}';
    }

    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|css|js|woff2?)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~* ^/(user/login|user/register|contact|api) {
        limit_req zone=api_rate burst=80 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_index index.php;
        fastcgi_read_timeout 120;
        fastcgi_send_timeout 120;
        fastcgi_connect_timeout 30;
        fastcgi_buffers 32 32k;
        fastcgi_buffer_size 64k;
        fastcgi_pass php_app_pool;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

