; Supervisor config for queue + scheduler (high-load baseline)
; Path: /etc/supervisor/conf.d/laravel-highload.conf

[program:core-asset-queue-default]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/core-asset-investing/core/artisan queue:work redis --queue=default --sleep=1 --tries=3 --timeout=120 --memory=512
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=16
redirect_stderr=true
stdout_logfile=/var/log/supervisor/core-asset-queue-default.log
stopwaitsecs=3600

[program:core-asset-queue-notify]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/core-asset-investing/core/artisan queue:work redis --queue=high,notifications --sleep=1 --tries=3 --timeout=120 --memory=512
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=8
redirect_stderr=true
stdout_logfile=/var/log/supervisor/core-asset-queue-notify.log
stopwaitsecs=3600

[program:core-asset-scheduler]
command=php /var/www/core-asset-investing/core/artisan schedule:work
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/core-asset-scheduler.log

